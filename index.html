<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragamalika — A Private Music Archive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="brand" href="#/">Ragamalika <span>రాగమాలిక</span></a>
  <nav class="breadcrumb" id="breadcrumb"></nav>
</div>

<main id="app"></main>

<div class="player">
  <div class="player-bg"><img src="" alt=""></div>
  <div class="player-inner">
    <div class="disc"></div>
    <div class="now-playing">
      <div class="title">Nothing playing</div>
      <div class="sub">Pick a song to begin</div>
    </div>
    <div class="controls">
      <button class="ctrl-btn prev" aria-label="Previous">⏮</button>
      <button class="ctrl-btn play" aria-label="Play/Pause">▶</button>
      <button class="ctrl-btn next" aria-label="Next">⏭</button>
      <button class="ctrl-btn shuffle" aria-label="Shuffle">🔀</button>
      <button class="ctrl-btn loop" aria-label="Loop">🔁</button>
    </div>
    <div class="progress-wrap">
      <span class="time-current">0:00</span>
      <div class="progress-bar"><div class="progress-fill"></div></div>
      <span class="time-total">0:00</span>
    </div>
    <button class="bg-change-btn">🖼 <span>Change Background</span></button>
  </div>
</div>

<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
